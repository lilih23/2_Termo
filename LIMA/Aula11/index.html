    <link rel="stylesheet" href="style.css">
    <title>CSS - Grid</title>
</head>
<body>

        <nav>
            <ul class="grid-ex1">

                <li>

                </li>
            </ul>

    <section class="grid-gal">
        <header>
            <h2>Nosso Conteúdo</h2>
        </header>
        <ul class="grid-gal-img">
            <li>
                <figure>
                    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTcfItNkmsFuWf6krb-xbpkH6ssAjJUu_N4eQ2P_GhuRG8YQ5on_7_zbRZfl0DTjgEV56VIla-paSyGk3XfQmIJ5w-aG7Dr523nFqczEhs&s=10" alt="imagem exemplo 1">

            <li>

                    <img src="https://i.pinimg.com/736x/df/1d/41/df1d4127590a012084e8e3f8f03d21dd.jpg" alt="imagem exemplo 2"> 
                </figure>
            </li>
            <li>
                <figure>
                    <img src="https://i.pinimg.com/236x/50/14/01/50140163d4a6f64c9d5427a47f7b36ca.jpg" alt="imagem exemplo 3"> 
                </figure>
            </li>
            <li>
                <figure>
                    <img src="https://cdn.awsli.com.br/600x450/379/379396/produto/35668804/75cdf11939.jpg" alt="imagem exemplo 4"> 
                </figure>
            </li>
        </ul>
    </section>

    <section>
        <header>
            <ul class="flex-grid">
                <li>
                    <article>
                        Flex 1
                    </article>
                </li>
                <li>
                    <article>
                        Flex 2
                    </article>
                </li>
                <li>
                    <article>
                        Flex 3
                    </article>
                </li>
        </header>
    </section>

    <section>
        <ul class="lab-grid">
            <li>1</li>
            <li>2</li>
            <li>3</li>
            <li>4</li>
            <li>5</li>
            <li>6</li>
            <!-- li{$}*8 --> inserir lista 
        </ul>
    </section>

</html>
